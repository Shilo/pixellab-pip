name: Dependabot Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Merge tested dependency update
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # pull_request_target uses trusted base code; never check out or run PR code
      # with this job's write token. CI runs PR code separately with read permissions.
      - name: Checkout trusted base
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          (steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.package-ecosystem == 'pip') &&
          steps.metadata.outputs.maintainer-changes == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for checks and merge the verified commit
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          (steps.metadata.outputs.package-ecosystem == 'github_actions' ||
          steps.metadata.outputs.package-ecosystem == 'pip') &&
          steps.metadata.outputs.maintainer-changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 dev-tools/dependabot_merge.py "$PR_NUMBER" "$PR_HEAD_SHA"
          gh pr merge "$PR_URL" --squash --match-head-commit "$PR_HEAD_SHA"
