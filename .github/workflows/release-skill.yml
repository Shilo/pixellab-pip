name: Release New Version
run-name: ${{ inputs.version && format('Release Version {0}', inputs.version) || 'Release New Version (auto-bump)' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release, e.g. 1.6.0. Leave blank to auto-bump the minor version."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write # sign the build-provenance attestation via Sigstore
  attestations: write

jobs:
  release:
    name: Bump version and release skill
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -r requirements-dev.txt

      - name: Ensure branch dispatch
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "This workflow must be run from a branch."
            exit 1
          fi

      - name: Require security service credentials
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        shell: bash
        run: |
          for name in VIRUSTOTAL_API_KEY CLAWHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Required repository secret $name is not configured."
              exit 1
            fi
          done

      - name: Run QA checks
        shell: bash
        run: python dev-tools/qa.py

      - name: Run skill security scan
        shell: bash
        # Same pinned SkillSpector as security-scan.yml; blocks the release if the risk score exceeds its threshold.
        run: |
          python -m pip install "skillspector @ git+https://github.com/NVIDIA/skillspector.git@dde36f258729b5aec7c835295a9556e64a2def0c"
          skillspector scan skills/pixellab-pip --no-llm

      - name: Find previous tag
        id: previous_tag
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Bump JSON versions
        id: bump
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = process.cwd();
          const skillName = "pixellab-pip";
          const skillDir = path.join(root, "skills", skillName);
          const manifests = [
            { file: ".agents/plugins/marketplace.json", versionPaths: [["plugins", 0, "version"]] },
            { file: ".claude-plugin/marketplace.json", versionPaths: [["plugins", 0, "version"]] },
            { file: ".claude-plugin/plugin.json", versionPaths: [["version"]] },
            { file: ".codex-plugin/plugin.json", versionPaths: [["version"]] },
            { file: ".cursor-plugin/marketplace.json", versionPaths: [["plugins", 0, "version"]] },
            { file: ".cursor-plugin/plugin.json", versionPaths: [["version"]] },
            { file: ".github/plugin/marketplace.json", versionPaths: [["plugins", 0, "version"]] },
            { file: "gemini-extension.json", versionPaths: [["version"]] },
            { file: "plugin.json", versionPaths: [["version"]] },
          ];

          if (!fs.existsSync(skillDir) || !fs.statSync(skillDir).isDirectory()) {
            throw new Error(`Expected skill folder at skills/${skillName}`);
          }

          const files = manifests.map((manifest) => {
            const fullPath = path.join(root, manifest.file);
            if (!fs.existsSync(fullPath)) {
              throw new Error(`Expected manifest file at ${manifest.file}`);
            }

            return {
              ...manifest,
              fullPath,
              data: JSON.parse(fs.readFileSync(fullPath, "utf8")),
            };
          });

          function getPath(value, pathParts, file) {
            let current = value;
            for (const part of pathParts) {
              if (current == null || !(part in current)) {
                throw new Error(`Missing version path ${pathParts.join(".")} in ${file}`);
              }
              current = current[part];
            }
            return current;
          }

          function setPath(value, pathParts, newVersion) {
            let current = value;
            for (const part of pathParts.slice(0, -1)) {
              current = current[part];
            }
            current[pathParts[pathParts.length - 1]] = newVersion;
          }

          function bumpVersion(version) {
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`Expected version to use MAJOR.MINOR.PATCH format, found: ${version}`);
            }

            const [major, minor] = version.split(".").map(Number);
            if (minor + 1 >= 10) {
              return `${major + 1}.0.0`;
            }

            return `${major}.${minor + 1}.0`;
          }

          const versions = [
            ...new Set(files.flatMap(({ data, file, versionPaths }) =>
              versionPaths.map((versionPath) => getPath(data, versionPath, file))
            )),
          ];

          if (versions.length !== 1) {
            throw new Error(`Expected exactly one current JSON version, found: ${versions.join(", ") || "none"}`);
          }

          const oldVersion = versions[0];
          const inputVersion = (process.env.INPUT_VERSION || "").trim();
          if (inputVersion && !/^\d+\.\d+\.\d+$/.test(inputVersion)) {
            throw new Error(`Requested version must be MAJOR.MINOR.PATCH, found: ${inputVersion}`);
          }
          if (inputVersion && inputVersion === oldVersion) {
            throw new Error(`Requested version ${inputVersion} is already the current version.`);
          }
          const newVersion = inputVersion || bumpVersion(oldVersion);
          const updatedFiles = [];

          for (const item of files) {
            for (const versionPath of item.versionPaths) {
              setPath(item.data, versionPath, newVersion);
            }

            fs.writeFileSync(item.fullPath, `${JSON.stringify(item.data, null, 2)}\n`);
            updatedFiles.push(item.file);
          }

          // Keep the live ClawHub/VirusTotal security badges pointed at the released version.
          const readmePath = path.join(root, "README.md");
          if (fs.existsSync(readmePath)) {
            const readmeBefore = fs.readFileSync(readmePath, "utf8");
            const needle = `skills%2F${skillName}%2Fversions%2F${oldVersion}`;
            if (!readmeBefore.includes(needle)) {
              throw new Error(`README ClawHub badge does not point at current version ${oldVersion}.`);
            }
            const readmeAfter = readmeBefore.split(needle).join(`skills%2F${skillName}%2Fversions%2F${newVersion}`);
            if (readmeAfter !== readmeBefore) {
              fs.writeFileSync(readmePath, readmeAfter);
              updatedFiles.push("README.md");
            }
          }

          if (updatedFiles.length === 0) {
            throw new Error("No JSON version fields were updated.");
          }

          fs.mkdirSync(path.join(root, "dist"), { recursive: true });
          fs.writeFileSync(path.join(root, "dist", "updated-files.txt"), `${updatedFiles.join("\n")}\n`);

          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`old_version=${oldVersion}\n`);
          output.write(`new_version=${newVersion}\n`);
          output.write(`tag=v${newVersion}\n`);
          output.write(`skill_name=${skillName}\n`);
          output.end();

          console.log(`Bumped ${oldVersion} -> ${newVersion}`);
          console.log(`Updated JSON files: ${updatedFiles.join(", ")}`);
          NODE

      - name: Build skill archive
        shell: bash
        run: |
          generated="$(find "skills/${{ steps.bump.outputs.skill_name }}" \
            \( -type d -name __pycache__ -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) \
            -print -quit)"
          if [ -n "$generated" ]; then
            echo "Generated Python cache artifact found in publish tree: $generated"
            exit 1
          fi
          mkdir -p dist
          cd skills
          # Keep the exclusion as defense in depth; the check above must already
          # prove that neither the GitHub archive nor the ClawHub upload can contain bytecode.
          zip -r "../dist/${{ steps.bump.outputs.skill_name }}-${{ steps.bump.outputs.new_version }}.zip" "${{ steps.bump.outputs.skill_name }}" -x '*/__pycache__/*'
          zipinfo -1 "../dist/${{ steps.bump.outputs.skill_name }}-${{ steps.bump.outputs.new_version }}.zip" | grep -q '^${{ steps.bump.outputs.skill_name }}/SKILL.md$'
          ! zipinfo -1 "../dist/${{ steps.bump.outputs.skill_name }}-${{ steps.bump.outputs.new_version }}.zip" | grep -q '^skills/'

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ steps.bump.outputs.skill_name }}-${{ steps.bump.outputs.new_version }}.zip

      - name: VirusTotal scan release asset
        id: virustotal
        timeout-minutes: 35
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          artifact="dist/${{ steps.bump.outputs.skill_name }}-${{ steps.bump.outputs.new_version }}.zip"
          upload_json="$(curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors \
            --request POST 'https://www.virustotal.com/api/v3/files' \
            --header "x-apikey: $VIRUSTOTAL_API_KEY" \
            --form "file=@${artifact}")"
          analysis_id="$(jq -er '.data.id' <<<"$upload_json")"

          for attempt in {1..60}; do
            analysis_json="$(curl --fail-with-body --silent --show-error \
              --retry 5 --retry-all-errors \
              --header "x-apikey: $VIRUSTOTAL_API_KEY" \
              "https://www.virustotal.com/api/v3/analyses/${analysis_id}")"
            status="$(jq -er '.data.attributes.status' <<<"$analysis_json")"
            if [ "$status" = completed ]; then
              malicious="$(jq -er '.data.attributes.stats.malicious' <<<"$analysis_json")"
              suspicious="$(jq -er '.data.attributes.stats.suspicious' <<<"$analysis_json")"
              if [ "$malicious" -ne 0 ] || [ "$suspicious" -ne 0 ]; then
                echo "VirusTotal rejected the release: malicious=$malicious suspicious=$suspicious"
                exit 1
              fi
              sha256="$(sha256sum "$artifact" | cut -d' ' -f1)"
              report_url="https://www.virustotal.com/gui/file/${sha256}/detection"
              echo "VirusTotal completed cleanly: malicious=0 suspicious=0"
              echo "url=${report_url}" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "VirusTotal analysis status: $status (attempt $attempt/60)"
            if [ "$attempt" -eq 60 ]; then
              echo "VirusTotal did not complete within 30 minutes (last status: $status)."
              exit 1
            fi
            sleep 30
          done

      - name: Point security badges at this release
        env:
          PROV_URL: ${{ steps.attest.outputs.attestation-url }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.url }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, pathlib
          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")
          prov = os.environ.get("PROV_URL", "").strip()
          vt = os.environ.get("VT_ANALYSIS", "").strip()
          changed = False
          if prov:
              text, n = re.subn(
                  r'(\]\(https://img\.shields\.io/badge/Build_Provenance-[^)]*\)\]\()[^)]*(\))',
                  lambda m: m.group(1) + prov + m.group(2), text)
              if n != 1:
                  raise SystemExit(f"Expected one Build Provenance badge, updated {n}")
              changed = changed or bool(n)
          if vt:
              text, n = re.subn(
                  r'(label=VirusTotal[^)]*\)\]\()[^)]*(\))',
                  lambda m: m.group(1) + vt + m.group(2), text)
              if n != 1:
                  raise SystemExit(f"Expected one VirusTotal badge, updated {n}")
              changed = changed or bool(n)
          if changed:
              readme.write_text(text, encoding="utf-8")
              uf = pathlib.Path("dist/updated-files.txt")
              lines = uf.read_text().splitlines() if uf.exists() else []
              if "README.md" not in lines:
                  lines.append("README.md")
                  uf.write_text("\n".join(lines) + "\n")
          print(f"badge links updated: prov={bool(prov)} vt={bool(vt)} changed={changed}")
          PY

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t updated_files < dist/updated-files.txt
          git add -- "${updated_files[@]}"
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push --atomic origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_args=(--generate-notes)
          if [ -n "${{ steps.previous_tag.outputs.previous_tag }}" ]; then
            notes_args+=(--notes-start-tag "${{ steps.previous_tag.outputs.previous_tag }}")
          fi

          gh release create "${{ steps.bump.outputs.tag }}" \
            "dist/${{ steps.bump.outputs.skill_name }}-${{ steps.bump.outputs.new_version }}.zip" \
            --title "PixelLab Pip Skill ${{ steps.bump.outputs.tag }}" \
            "${notes_args[@]}" \
            --verify-tag

      - name: Publish to ClawHub for its independent security audit
        # No continue-on-error: the README badges pin the released version, so a silent publish
        # failure leaves them resolving to "resource not found". The release is already published
        # at this point, so a red run signals that ClawHub needs a re-publish.
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_OWNER: ${{ vars.CLAWHUB_OWNER }} # optional publisher handle; defaults to the token's account
        shell: bash
        # One-time setup: create a ClawHub account, generate an API token, add it as the CLAWHUB_TOKEN repo secret
        # (optionally set a CLAWHUB_OWNER repo variable). Publishing uploads the version; the scan below is what
        # produces its public audit verdict and badge data. The skill folder stays agent-agnostic — no
        # OpenClaw-specific files are added to it.
        run: |
          npx --yes clawhub@0.23.3 --no-input login --token "$CLAWHUB_TOKEN"
          owner_args=()
          if [ -n "$CLAWHUB_OWNER" ]; then owner_args=(--owner "$CLAWHUB_OWNER"); fi
          set +e
          out="$(npx --yes clawhub@0.23.3 --no-input skill publish "skills/${{ steps.bump.outputs.skill_name }}" \
            --slug "${{ steps.bump.outputs.skill_name }}" \
            --name "PixelLab Pip" \
            --version "${{ steps.bump.outputs.new_version }}" \
            --changelog "Release ${{ steps.bump.outputs.tag }}" \
            --tags latest \
            --topics "pixellab,pixel-art,game-assets,sprites,mcp" \
            --source-repo "${{ github.repository }}" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-ref "${{ steps.bump.outputs.tag }}" \
            --source-path "skills/${{ steps.bump.outputs.skill_name }}" \
            "${owner_args[@]}" 2>&1)"
          status=$?
          set -e
          echo "$out"
          # An upload that already landed is success for this step's purpose: the scan below still has to run,
          # and without this a re-release of the same version could never finish.
          if [ "$status" -ne 0 ] && ! grep -qF "already exists" <<<"$out"; then
            exit "$status"
          fi

      - name: Scan the published ClawHub version
        timeout-minutes: 35 # the CLI polls the scan queue for up to 30 minutes
        # The CLI equivalent of the Rescan button on the ClawHub security-audit page. Publishing alone leaves the
        # version without an audit verdict, which is what the README badges read, so scan every release.
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          scan_output="$(npx --yes clawhub@0.23.3 --no-input scan \
            --slug "${{ steps.bump.outputs.skill_name }}" \
            --version "${{ steps.bump.outputs.new_version }}" \
            --update \
            --json \
            --output "dist/clawhub-scan-${{ steps.bump.outputs.new_version }}.zip")"
          printf '%s\n' "$scan_output"
          printf '%s\n' "$scan_output" | sed -n '/^{/,$p' > dist/clawhub-scan.json
          python - <<'PY'
          import json, os, pathlib

          data = json.loads(pathlib.Path("dist/clawhub-scan.json").read_text(encoding="utf-8"))
          report = data.get("report") or {}
          artifact = data.get("artifact") or {}

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          require(data.get("status") == "succeeded", "ClawHub scan did not succeed")
          require(data.get("sourceKind") == "published", "ClawHub scanned the wrong source kind")
          require(data.get("writtenBack") is True, "ClawHub did not write the audit back to the published version")
          require(artifact.get("version") == os.environ["EXPECTED_VERSION"], "ClawHub audited the wrong version")

          clawscan = report.get("clawscan") or {}
          require(str(clawscan.get("verdict", "")).casefold() == "benign", "ClawHub ClawScan verdict is not benign")
          skillspector = report.get("skillspector") or {}
          require(str(skillspector.get("status", "")).casefold() == "clean", "ClawHub SkillSpector status is not clean")
          require(skillspector.get("issueCount") == 0, "ClawHub SkillSpector reported issues")
          static = report.get("staticAnalysis") or {}
          require(str(static.get("status", "")).casefold() == "clean", "ClawHub static analysis is not clean")

          virustotal = report.get("virustotal")
          if virustotal is not None:
              require(virustotal.get("malicious", 0) == 0, "ClawHub VirusTotal telemetry reported malicious detections")
              require(virustotal.get("suspicious", 0) == 0, "ClawHub VirusTotal telemetry reported suspicious detections")
          print("ClawHub exact-version audit passed and was written back")
          PY

      - name: Append verified security summary to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VT_ANALYSIS: ${{ steps.virustotal.outputs.url }}
        shell: bash
        run: |
          ver="${{ steps.bump.outputs.new_version }}"
          gh release view "${{ steps.bump.outputs.tag }}" --json body --jq .body > notes.md
          {
            printf '\n---\n\n## 🔒 Security — safe to install, checked by outside services\n\n'
            printf 'This release is independently scanned and cryptographically signed. See any of it for yourself:\n\n'
            printf -- '- **Skill audit** — passed [NVIDIA SkillSpector](https://github.com/NVIDIA/SkillSpector) static analysis; public on the [Code Scanning tab](https://github.com/Shilo/pixellab-pip/security/code-scanning) (a release is blocked if it goes over the risk threshold).\n'
            printf -- '- **Independent registry audit** — [ClawHub security audit ↗](https://clawhub.ai/shilo/skills/pixellab-pip/security-audit) (ClawScan + SkillSpector).\n'
            printf -- '- **Malware scan** — [VirusTotal security report ↗](%s) completed with zero malicious or suspicious detections for this exact download.\n' "$VT_ANALYSIS"
            printf -- '- **Tamper-proof build** — this zip has a cryptographic proof-of-origin; confirm nobody altered it since this repo built it: `gh attestation verify pixellab-pip-%s.zip --repo Shilo/pixellab-pip`\n' "$ver"
            printf -- '\nFull details: https://github.com/Shilo/pixellab-pip#security\n'
          } >> notes.md
          gh release edit "${{ steps.bump.outputs.tag }}" --notes-file notes.md
