name: Quality Assurance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: Repository QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -r requirements-dev.txt

      - name: Run QA checks
        shell: bash
        run: python dev-tools/qa.py

      - name: Setup Node for native adapter tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Validate and test native Claude adapter offline
        shell: bash
        run: |
          npx --yes --package @anthropic-ai/claude-code@2.1.303 claude plugin validate .
          npx --yes --package @anthropic-ai/claude-code@2.1.303 claude plugin test .
