name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: HOL Plugin Scanner
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan repository
        uses: hashgraph-online/ai-plugin-scanner-action@11ff35008c1dde7d7b0c2978b0cd4f6b495448e8 # v1.2.704
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          online: false
          upload_sarif: false
          pr_comment: off
          submission_enabled: false
          install_cisco: false
